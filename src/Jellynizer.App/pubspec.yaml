name: jellynizer_app
description: A simple app to trigger the Jellynizer API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  get_it: ^8.0.3
  http: ^1.3.0
  # Pinned below 1.9.0: 1.9.0 dropped its own Kotlin Gradle plugin and relies on AGP 9's
  # built-in Kotlin, which needs Flutter >= 3.44 (and shared_preferences_android >= 2.5.x).
  # Remove the upper bound together with the Flutter/Gradle/AGP upgrade - see
  # README.md "Android APK builds".
  receive_sharing_intent: ">=1.8.1 <1.9.0"
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  # Provides InMemorySharedPreferencesAsync, used by widget tests: StorageService builds a
  # SharedPreferencesAsync, which needs a platform implementation to exist.
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true

# The source artwork in assets/icon/ is a build input only, so it is deliberately not
# listed under "flutter: assets:" and never ships inside the app bundle.
# Regenerate with: python3 tool/generate_icon.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#000B25"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#000B25"
    theme_color: "#000B25"
